<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TGX CRACKED BY RIFU- FREE TOOL</title>
    <style>
        :root {
            --glass: rgba(0, 255, 255, 0.08);
            --border: rgba(0, 255, 255, 0.35);
            --neon-cyan: #00ffff;
            --neon-violet: #8a2be2;
            --cyber-lime: #ccff00;
            --deep-dark: #0b0c1e;
        }

        body, html {
            height: 100%; margin: 0; font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--deep-dark); color: #e0f0ff; overflow-x: hidden;
        }

        .app-frame { max-width: 480px; margin: auto; padding: 15px; }
        .glass-card {
            background: rgba(10, 20, 30, 0.5); backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid var(--border); border-radius: 24px;
            padding: 20px; margin-bottom: 20px;
            box-shadow: 0 10px 35px -5px rgba(0, 255, 255, 0.3);
        }
        .header { text-align: center; border-bottom: 2px solid var(--neon-cyan); padding-bottom: 10px; margin-bottom: 20px; }
        .header span:first-child { color: #ffffff; font-weight: 800; letter-spacing: 2px; }
        .pred-val { font-size: 75px; font-weight: 900; text-shadow: 0 0 25px var(--neon-violet), 0 0 45px var(--neon-cyan); margin: 10px 0; color: #fff; }
        .timer-display { font-size: 26px; color: var(--cyber-lime); font-weight: bold; text-shadow: 0 0 10px #ccff00; }
        .status-info { display: flex; justify-content: space-between; font-size: 11px; color: var(--neon-cyan); margin-bottom: 10px; }
        .strat-mode { font-size: 10px; background: rgba(138, 43, 226, 0.25); padding: 4px 14px; border-radius: 30px; color: var(--cyber-lime); border: 1px solid var(--neon-cyan); display: inline-block; margin-bottom: 12px; }
        .lvl-badge { background: rgba(0, 255, 255, 0.1); border: 1px solid var(--neon-cyan); padding: 8px; border-radius: 40px; font-weight: bold; margin: 15px 0; font-size: 13px; }
        .num-row { display: flex; justify-content: center; gap: 30px; }
        .num-circle { width: 50px; height: 50px; line-height: 50px; border: 2px solid var(--cyber-lime); border-radius: 50%; font-weight: 900; background: rgba(0,0,0,0.5); color: var(--cyber-lime); font-size: 22px; text-align: center; }
        .btn-clear { width: 100%; padding: 12px; background: linear-gradient(90deg, #ff2a5e, #b030b0); border: none; border-radius: 40px; color: white; font-weight: 800; cursor: pointer; margin-top: 10px; }
        .history-wrap { max-height: 400px; overflow-y: auto; border-radius: 16px; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        th { color: var(--neon-cyan); padding: 10px 4px; border-bottom: 1px solid var(--neon-violet); }
        td { padding: 8px 4px; border-bottom: 1px solid rgba(0, 255, 255, 0.1); text-align: center; }
        .win { color: #ccff00; font-weight: bold; }
        .loss { color: #ff10f0; font-weight: bold; }
        .free-badge { background: #ff2a5e; color: white; padding: 8px; border-radius: 30px; text-align: center; font-weight: bold; margin-bottom: 15px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="app-frame">
        <div class="free-badge">
            🔓 CRACKED BY RIFU - FREE FOR ALL 🔓
        </div>
        <div class="header">
            <span style="font-size: 26px;">TGX PRO </span><span style="font-size: 22px;">[CRACKED]</span>
        </div>

        <div id="hackSection">
            <div class="status-info">
                <span>🔧 SERVER: FREE MODE</span>
                <span id="pingVal">⚡ CRACKED VERSION</span>
            </div>

            <div class="glass-card" style="text-align: center;">
                <div id="stratDisplay" class="strat-mode">MODE: TGX PRO SCAN</div>
                <div id="timer" class="timer-display">00:30</div>
                <div id="pID" style="margin-bottom: 6px;">PERIOD: ---</div>
                <div id="pRes" class="pred-val">INIT</div>
                <div id="mLevel" class="lvl-badge">MARTINGALE: LEVEL 1 (1X)</div>
                <div style="font-size: 11px; color: var(--cyber-lime); margin-bottom: 5px;">⟁ OPPOSITE NUMBERS ⟁</div>
                <div class="num-row" id="numRow">
                    <div class="num-circle">?</div>
                    <div class="num-circle">?</div>
                </div>
            </div>

            <div class="glass-card">
                <div style="font-size: 12px; color: var(--neon-cyan); margin-bottom: 12px; display: flex; justify-content: space-between;">
                    <span>🌀 NEURAL HISTORY (MAX 100)</span>
                    <button class="btn-clear" onclick="clearHistory()">🗑️ CLEAR LOG</button>
                </div>
                <div class="history-wrap">
                    <table>
                        <thead><tr><th>PERIOD</th><th>PRED</th><th>RESULT</th><th>STATUS</th></tr></thead>
                        <tbody id="logs"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

<script>
    // CRACKED VERSION - NO PAYMENT NEEDED
    const API = "https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json";
    let lastP = null, nextP = null, targetNums = [], currentLevel = 1;
    let historyLogs = [];

    const sWin = new Audio('https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3');
    const sLoss = new Audio('https://assets.mixkit.co/active_storage/sfx/951/951-preview.mp3');
    const sDing = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');

    window.onload = () => {
        startClock();
        syncEngine();
        setInterval(syncEngine, 2000);
    };

    function clearHistory() {
        historyLogs = [];
        document.getElementById('logs').innerHTML = '';
    }

    function startClock() {
        setInterval(() => {
            let rem = 30 - (new Date().getSeconds() % 30);
            if(rem === 30) rem = 0;
            document.getElementById('timer').innerText = `00:${rem < 10 ? '0' + rem : rem}`;
            if(rem === 5) sDing.play().catch(()=>{});
            document.getElementById('timer').style.color = rem <= 5 ? "#ff10f0" : "#ccff00";
        }, 1000);
    }

    async function syncEngine() {
        try {
            const r = await fetch(API + '?t=' + Date.now());
            const d = await r.json();
            const top = d.data.list[0];
            processHybrid(top.issueNumber, parseInt(top.number), d.data.list);
        } catch (e) {}
    }

    function processHybrid(p, num, list) {
        const actual = num >= 5 ? "BIG" : "SMALL";
        if (lastP !== p) {
            if (nextP && lastP) {
                const win = (nextP === actual) || targetNums.includes(num);
                if(win) { sWin.play().catch(()=>{}); currentLevel = 1; }
                else { sLoss.play().catch(()=>{}); currentLevel++; if(currentLevel > 4) currentLevel = 1; }
                
                const multiplier = currentLevel === 1 ? "1X" : (currentLevel === 2 ? "3X" : (currentLevel === 3 ? "9X" : "27X"));
                document.getElementById('mLevel').innerText = `MARTINGALE: LEVEL ${currentLevel} (${multiplier})`;
                
                const entry = {
                    period: p.slice(-3),
                    pred: nextP,
                    result: `${actual}(${num})`,
                    status: win ? 'WIN' : 'LOSS',
                    winClass: win ? 'win' : 'loss'
                };
                historyLogs.unshift(entry);
                if (historyLogs.length > 100) historyLogs = historyLogs.slice(0, 100);
                
                const row = `<tr><td>${entry.period}</td><td>${entry.pred}</td><td>${entry.result}</td><td class="${entry.winClass}">${entry.status}</td></tr>`;
                document.getElementById('logs').innerHTML = row + document.getElementById('logs').innerHTML;
            }
            
            lastP = p;
            
            const last5 = list.slice(0, 5).map(x => parseInt(x.number) >= 5 ? "BIG" : "SMALL");
            const lastNums = list.slice(0, 5).map(x => parseInt(x.number));
            const stratDisp = document.getElementById('stratDisplay');
            
            if (last5[0] === last5[1] && last5[1] === last5[2]) {
                nextP = last5[0];
                stratDisp.innerText = "MODE: DRAGON PULSE";
            } else {
                nextP = (last5[0] === "BIG") ? "SMALL" : "BIG";
                stratDisp.innerText = "MODE: NEURAL REVERSE";
            }
            
            const sum = lastNums.reduce((a, b) => a + b, 0);
            if (nextP === "BIG") {
                targetNums = (sum > 20) ? [0, 2] : [1, 3];
            } else {
                targetNums = (sum < 25) ? [7, 9] : [6, 8];
            }
            
            document.getElementById('pID').innerText = "PERIOD: " + (BigInt(p) + 1n).toString();
            document.getElementById('pRes').innerText = nextP;
            document.getElementById('pRes').style.color = nextP === "BIG" ? "#00ffff" : "#ccff00";
            document.getElementById('numRow').innerHTML = `<div class="num-circle">${targetNums[0]}</div><div class="num-circle">${targetNums[1]}</div>`;
        }
    }
</script>
</body>
</html>
